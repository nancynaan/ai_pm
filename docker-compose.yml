name: ai-pm

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aipm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aipm}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  # Database browser at http://localhost:5050. Desktop mode (no pgAdmin login, local only); the
  # project database is registered on start, with a pgpass file built from the values in .env.
  pgadmin:
    image: dpage/pgadmin4:9.8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
      POSTGRES_USER: ${POSTGRES_USER:-aipm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aipm}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s\n' "postgres:5432:*:$${POSTGRES_USER}:$${POSTGRES_PASSWORD}" > /var/lib/pgadmin/pgpass
        chmod 600 /var/lib/pgadmin/pgpass
        printf '{"Servers":{"1":{"Name":"AI PM (local)","Group":"Servers","Host":"postgres","Port":5432,"MaintenanceDB":"%s","Username":"%s","SSLMode":"prefer","PassFile":"/var/lib/pgadmin/pgpass"}}}' "$${POSTGRES_DB}" "$${POSTGRES_USER}" > /var/lib/pgadmin/servers.json
        exec /entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin:/var/lib/pgadmin

  app:
    build: .
    image: ai-pm-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # Inside Docker the app reaches the other services by name.
      NODE_ENV: production
      APP_PORT: '3000'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      CLAUDE_CLI_PATH: claude
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  pgadmin:
